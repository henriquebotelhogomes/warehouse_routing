<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#0ea5e9" stroke-width="2.5" />

  <!-- Industrial Wheel Tracks (Left & Right) -->
  <rect x="7" y="20" width="7" height="26" rx="3.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <rect x="50" y="20" width="7" height="26" rx="3.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <line x1="7" y1="26" x2="14" y2="26" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7" />
  <line x1="7" y1="33" x2="14" y2="33" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7" />
  <line x1="7" y1="40" x2="14" y2="40" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7" />
  <line x1="50" y1="26" x2="57" y2="26" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7" />
  <line x1="50" y1="33" x2="57" y2="33" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7" />
  <line x1="50" y1="40" x2="57" y2="40" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7" />

  <!-- AMR Main Chassis -->
  <rect x="16" y="19" width="32" height="28" rx="8" fill="url(#cyanGrad)" stroke="#38bdf8" stroke-width="1.8" filter="url(#glow)" />

  <!-- Central LiDAR / Radar Scanner -->
  <ellipse cx="32" cy="17" rx="9" ry="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="32" cy="16" r="2.5" fill="#38bdf8" />
  <!-- LiDAR Wave Arc -->
  <path d="M22 11a13 6 0 0 1 20 0" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M26 8a8 4 0 0 1 12 0" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- AMR Visor / Sensor Array -->
  <rect x="21" y="26" width="22" height="10" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="1.2" />
  <!-- Glowing Dual Eyes -->
  <circle cx="27" cy="31" r="2.2" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="37" cy="31" r="2.2" fill="#22d3ee" filter="url(#glow)" />

  <!-- Status Indicator Beacon -->
  <circle cx="32" cy="41" r="1.8" fill="#10b981" />
</svg>